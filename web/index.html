<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Stream</title>
<style>
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:24px}
  h1{font-size:20px} #list{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  button{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 12px;cursor:pointer}
  button.active{background:#0a84ff;border-color:#0a84ff}
  video{width:100%;max-width:960px;background:#000;border-radius:12px}
  h2{font-size:16px;margin:24px 0 0}
  #imglist{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
  #imglist figure{margin:0;cursor:zoom-in;background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden}
  #imglist img{display:block;width:180px;height:130px;object-fit:cover;background:#000}
  #imglist figcaption{font-size:12px;color:#999;padding:6px 8px;word-break:break-all}
  #lightbox{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #lightbox.hidden{display:none} /* id beats .hidden's class specificity */
  #lightbox img{max-width:94vw;max-height:94vh;border-radius:8px}
  .size{color:#999;font-size:12px}
  #lockbar{display:flex;gap:8px;align-items:center;margin:8px 0}
  #unlock{max-width:420px;display:flex;flex-direction:column;gap:8px;margin-top:24px}
  #unlock input{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:10px;font-family:monospace}
  #err{color:#ff7070;min-height:1.2em}
  .hidden{display:none}
</style>
</head>
<body>
<h1>Private Stream <span class="size">(local only — key stays on server RAM)</span></h1>

<div id="unlock" class="hidden">
  <p>Server is locked. Paste the 64-hex-char master key to watch.</p>
  <input id="key" type="password" placeholder="master key hex" autocomplete="off" spellcheck="false">
  <button id="unlockBtn">Unlock</button>
  <div id="err"></div>
</div>

<div id="app" class="hidden">
  <div id="lockbar">
    <button id="lockBtn">Lock</button>
    <span class="size" id="idle"></span>
  </div>
  <div id="list"></div>
  <video id="v" class="hidden" controls preload="metadata" playsinline></video>
  <h2 id="imghdr" class="hidden">Images</h2>
  <div id="imglist"></div>
</div>

<div id="lightbox" class="hidden"><img id="lbimg" alt=""></div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n > 1e9 ? (n/1e9).toFixed(2)+' GB' : Math.round(n/1e6)+' MB';

async function status() {
  const r = await fetch('/api/status');
  return r.json();
}
async function refresh() {
  const st = await status();
  $('unlock').classList.toggle('hidden', !st.locked);
  $('app').classList.toggle('hidden', st.locked);
  if (st.locked) { clearImages(); return; }
  $('idle').textContent = st.idleLockMinutes > 0 ? `auto-locks after ${st.idleLockMinutes} min idle` : 'auto-lock off';
  const r = await fetch('/api/videos');
  if (r.status === 401) return refresh(); // locked meanwhile
  const items = await r.json();
  const list = $('list');
  list.innerHTML = '';
  if (!items.length) { list.textContent = 'No videos yet. Run ./scripts/add-video.sh file.mp4'; }
  else {
    const v = $('v');
    for (const it of items) {
      const b = document.createElement('button');
      b.textContent = `${it.name} (${fmt(it.size)})`;
      b.onclick = () => {
        document.querySelectorAll('#list button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        v.classList.remove('hidden');
        v.src = '/video/' + encodeURIComponent(it.name);
        v.play().catch(()=>{});
      };
      list.appendChild(b);
    }
  }
  await refreshImages();
}

async function refreshImages() {
  const r = await fetch('/api/images');
  if (r.status === 401) return refresh(); // locked meanwhile
  const imgs = await r.json();
  const box = $('imglist');
  box.innerHTML = '';
  $('imghdr').classList.toggle('hidden', !imgs.length);
  for (const it of imgs) {
    const fig = document.createElement('figure');
    const im = document.createElement('img');
    im.src = '/image/' + encodeURIComponent(it.name);
    im.alt = it.name;
    im.loading = 'lazy';
    const cap = document.createElement('figcaption');
    cap.textContent = it.name;
    fig.append(im, cap);
    fig.onclick = () => openLightbox(im.src, it.name);
    box.appendChild(fig);
  }
}

function clearImages() {
  closeLightbox();
  $('imglist').innerHTML = '';
  $('imghdr').classList.add('hidden');
}

function openLightbox(src, alt) {
  const img = $('lbimg');
  img.src = src;
  img.alt = alt;
  $('lightbox').classList.remove('hidden');
}
function closeLightbox() {
  $('lightbox').classList.add('hidden');
  $('lbimg').removeAttribute('src');
}
$('unlockBtn').onclick = async () => {
  $('err').textContent = '';
  const r = await fetch('/api/unlock', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({keyHex: $('key').value.trim()}),
  });
  if (!r.ok) { $('err').textContent = (await r.json()).error || 'unlock failed'; return; }
  $('key').value = '';
  refresh();
};
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('unlockBtn').click(); });
$('lockBtn').onclick = async () => {
  await fetch('/api/lock', {method: 'POST'});
  document.querySelectorAll('#list button').forEach(x => x.classList.remove('active'));
  $('v').removeAttribute('src'); $('v').load();
  $('v').classList.add('hidden');
  clearImages();
  refresh();
};
$('lightbox').onclick = closeLightbox;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
refresh();
</script>
</body>
</html>
